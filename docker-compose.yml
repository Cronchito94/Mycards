# Stack de développement : PostgreSQL + API FastAPI.
# Démarrage : cp .env.example .env && docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: tcg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copiez .env.example en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tcg}
    ports:
      # Exposé sur l'hôte pour pouvoir inspecter la base en SQL (lot 2).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg} -d ${POSTGRES_DB:-tcg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Référentiel TCGdex auto-hébergé (image MIT, données embarquées).
  # Auto-hébergé plutôt que l'API publique : pas de limite de débit, pas de
  # dépendance réseau à l'import, et l'inspection TLS de certains postes ne
  # casse plus les appels. Voir docs/IMPORT.md.
  tcgdex:
    image: tcgdex/server:edge
    container_name: tcg_tcgdex
    restart: unless-stopped
    environment:
      # CI=true saute le chargement des tarifs : démarrage en ~25 s, mais
      # AUCUN prix servi. C'est le défaut, car l'import du lot 2 n'en a pas
      # besoin et que le démarrage avec prix prend 5 à 10 minutes.
      #
      # Pour activer les prix (lot 5), dans le .env :
      #     TCGDEX_CI=false
      #     TCGCSV_USER_AGENT=mon-app/0.1 mon.email@exemple.fr
      #
      # ⚠️ TCGCSV_USER_AGENT est OBLIGATOIRE dès que CI=false. Sans elle, le
      # chargement TCGplayer lève une exception qui interrompt le démarrage :
      # le serveur affiche « Server ready » mais n'écoute jamais, et toute
      # requête répond « Empty reply from server ». Vérifié le 15/09/2026.
      CI: ${TCGDEX_CI:-true}
      TCGCSV_USER_AGENT: ${TCGCSV_USER_AGENT:-}
    ports:
      - "${TCGDEX_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD-SHELL",
         "node -e \"require('http').get('http://localhost:3000/v2/en/sets',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      # Généreux à dessein : avec les prix activés, le serveur met 5 à 10
      # minutes à ouvrir son port. Un start_period court le déclarerait
      # malade alors qu'il travaille.
      retries: 40
      start_period: 600s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcg_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tcg:tcg@db:5432/tcg}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TCGDEX_BASE_URL: ${TCGDEX_BASE_URL:-http://tcgdex:3000}
      TCGDEX_RATE_LIMIT: ${TCGDEX_RATE_LIMIT:-0}
      TCGDEX_CONCURRENCY: ${TCGDEX_CONCURRENCY:-16}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Hot-reload en dev : le code de l'hôte masque celui de l'image.
      - ./backend/app:/srv/app/app
      - ./backend/alembic:/srv/app/alembic
      # Les tests ne sont pas dans l'image (elle reste minimale) mais montés
      # en dev : ceux de l'API ont besoin de la base, donc du réseau interne.
      - ./backend/tests:/srv/app/tests
      - ./backend/pyproject.toml:/srv/app/pyproject.toml:ro
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
