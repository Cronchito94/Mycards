# Stack de développement : PostgreSQL + API FastAPI.
# Démarrage : cp .env.example .env && docker compose up --build

services:
  db:
    image: postgres:16-alpine
    container_name: tcg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copiez .env.example en .env}
      POSTGRES_DB: ${POSTGRES_DB:-tcg}
    ports:
      # Exposé sur l'hôte pour pouvoir inspecter la base en SQL (lot 2).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg} -d ${POSTGRES_DB:-tcg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Référentiel TCGdex auto-hébergé (image MIT, données embarquées).
  # Auto-hébergé plutôt que l'API publique : pas de limite de débit, pas de
  # dépendance réseau à l'import, et l'inspection TLS de certains postes ne
  # casse plus les appels. Voir docs/IMPORT.md.
  tcgdex:
    image: tcgdex/server:edge
    container_name: tcg_tcgdex
    restart: unless-stopped
    environment:
      # OBLIGATOIRE. Sans CI=true le serveur télécharge les tarifs Cardmarket
      # et TCGplayer *avant* d'ouvrir son port ; derrière une inspection TLS
      # ces appels échouent en boucle et le port 3000 n'est jamais ouvert —
      # le conteneur paraît sain mais ne répond pas. Les prix relèvent du
      # lot 5, pas de l'import du référentiel.
      CI: "true"
    ports:
      - "${TCGDEX_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD-SHELL",
         "node -e \"require('http').get('http://localhost:3000/v2/en/sets',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcg_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tcg:tcg@db:5432/tcg}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TCGDEX_BASE_URL: ${TCGDEX_BASE_URL:-http://tcgdex:3000}
      TCGDEX_RATE_LIMIT: ${TCGDEX_RATE_LIMIT:-0}
      TCGDEX_CONCURRENCY: ${TCGDEX_CONCURRENCY:-16}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Hot-reload en dev : le code de l'hôte masque celui de l'image.
      - ./backend/app:/srv/app/app
      - ./backend/alembic:/srv/app/alembic
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        ["CMD-SHELL",
         "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
